modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="coltan_logo.png"
authors="${mod_authors}"
description='''${mod_description}'''
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="superbwarfare"
    mandatory=false
    versionRange="${sbw_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="gemrender"
    mandatory=false
    # 0.1.20: ParticleEmitter.spawn returns ParticleCollision.Contact (binary break vs 0.1.0-built jars).
    versionRange="[0.1.20,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="simpleenemymod"
    mandatory=false
    versionRange="${sem_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="corpse"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[mixins]]
config="coltan.mixins.json"
